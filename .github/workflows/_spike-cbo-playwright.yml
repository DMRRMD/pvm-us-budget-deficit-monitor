name: SPIKE - CBO Playwright reachability check

on:
  push:
    branches: [ feature/net-interest-and-cbo-forecast ]
    paths:
      - '.github/workflows/_spike-cbo-playwright.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Probe CBO with a real headless browser
        run: |
          python3 - <<'PYEOF'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(user_agent=(
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"
              ))
              resp = page.goto("https://www.cbo.gov/recurring-publication/55140", timeout=30000)
              print("status:", resp.status if resp else None)
              print("title:", page.title())
              content = page.content()
              print("content length:", len(content))
              print("contains 'Monthly Budget Review':", "Monthly Budget Review" in content)
              print(content[:1500])
              browser.close()
          PYEOF
