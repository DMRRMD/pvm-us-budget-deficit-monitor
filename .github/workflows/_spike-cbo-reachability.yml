name: SPIKE - CBO reachability check

on:
  workflow_dispatch: {}
  push:
    branches: [ feature/net-interest-and-cbo-forecast ]
    paths:
      - '.github/workflows/_spike-cbo-reachability.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CBO endpoints
        run: |
          for url in \
            "https://www.cbo.gov/recurring-publication/55140" \
            "https://www.cbo.gov/" \
            "https://www.cbo.gov/system/files/2026-08/62276-2026-08-MBR.pdf"; do
            echo "=== $url ==="
            curl -sS -D - -o /dev/null \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "$url" || true
            echo
          done
