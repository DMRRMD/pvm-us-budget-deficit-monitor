yaml
name: Update Treasury Data

# ---------------------------------------------------------------------------
# IMPORTANT: GitHub Actions enforces a hard minimum interval of 5 minutes on
# scheduled workflows. Any cron step faster than /5 (e.g. the /2 this file
# used to have) is not honored — GitHub either silently drops the extra
# firings or delays the whole schedule unpredictably (worse under load,
# especially right at the top of the hour). That's what caused the missed
# 19:02 CET auction result: the previous /2 schedule looked fine in the YAML
# but was never actually running that often, and by chance the next real
# firing landed ~50 minutes later.
#
# This file fixes the schedule to the fastest interval GitHub will reliably
# honor (/5). For tighter responsiveness during the actual auction-result
# windows, pair this with the external dispatcher script (dispatch-on-release.js)
# which calls this workflow's `workflow_dispatch` trigger every 1-2 minutes
# from outside GitHub during the narrow release windows only. That path is
# not subject to GitHub's scheduler limitations at all, since it's just an
# authenticated API call.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "*/30 * * * *"          # baseline heartbeat, every 30 min all day

    # Bills are usually released ~11:30am ET; notes/bonds/TIPS/FRNs ~1:00pm ET.
    # Each window has an EDT and an EST entry so it doesn't need manual
    # adjustment across the twice-yearly clock change — the "wrong" one for
    # the current season just runs harmlessly and finds nothing new.
    - cron: "20-44/5 15 * * 1-5"    # bill results, EDT window (~11:30am ET)
    - cron: "20-44/5 16 * * 1-5"    # bill results, EST window
    - cron: "50-59/5 16 * * 1-5"    # note/bond/TIPS/FRN results, EDT window part 1 (~1:00pm ET)
    - cron: "0-15/5 17 * * 1-5"     # note/bond/TIPS/FRN results, EDT window part 2
    - cron: "50-59/5 17 * * 1-5"    # note/bond/TIPS/FRN results, EST window part 1
    - cron: "0-15/5 18 * * 1-5"     # note/bond/TIPS/FRN results, EST window part 2

  push:
    branches: [ main ]

  # This is the trigger the external dispatcher script calls via the REST API.
  # It's also what lets you fire an update manually from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upcoming (announced) auctions
        run: |
          mkdir -p data
          curl -sSL --fail "https://www.treasurydirect.gov/TA_WS/securities/announced?format=json" -o data/upcoming.json
          python3 -c "import json; d=json.load(open('data/upcoming.json')); assert isinstance(d, list)"

      - name: Fetch recent auction results
        run: |
          START=$(date -u -d '45 days ago' +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          curl -sSL --fail "https://www.treasurydirect.gov/TA_WS/securities/search?format=json&startdate=${START}&enddate=${END}" -o data/results.json
          python3 -c "import json; d=json.load(open('data/results.json')); assert isinstance(d, list)"

      - name: Write fetch metadata
        run: |
          printf '{"fetchedAt":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/meta.json

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/upcoming.json data/results.json data/meta.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh Treasury auction data"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching latest and retrying..."
            git fetch origin main
            git reset --soft origin/main
            git add data/upcoming.json data/results.json data/meta.json
            if git diff --cached --quiet; then
              echo "Remote already has this data (another run pushed the same update). Nothing left to do."
              exit 0
            fi
            git commit -m "chore: refresh Treasury auction data"
            sleep $(( (RANDOM % 5) + 2 ))
          done

          echo "Failed to push after multiple attempts."
