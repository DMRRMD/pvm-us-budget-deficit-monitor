name: Update Treasury Data

# GitHub Actions enforces a hard minimum interval of 5 minutes on scheduled
# workflows. Anything faster than /5 is not honored - GitHub either drops
# the extra firings or delays the whole schedule unpredictably, worse under
# load. That is what caused the missed 19:02 CET result: the old /2 schedule
# looked fine in the YAML but was never really running that often.
#
# This version uses /5, the fastest interval GitHub reliably honors. Pair
# it with the Cloudflare Worker dispatcher for tighter coverage during the
# actual release windows, since that path calls workflow_dispatch directly
# and is not subject to GitHub's scheduler limits at all.

on:
  schedule:
    - cron: "*/30 * * * *"

    - cron: "20-44/5 15 * * 1-5"
    - cron: "20-44/5 16 * * 1-5"
    - cron: "50-59/5 16 * * 1-5"
    - cron: "0-15/5 17 * * 1-5"
    - cron: "50-59/5 17 * * 1-5"
    - cron: "0-15/5 18 * * 1-5"

  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-treasury-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upcoming (announced) auctions
        run: |
          mkdir -p data
          curl -sSL --fail "https://www.treasurydirect.gov/TA_WS/securities/announced?format=json" -o data/upcoming.json
          python3 -c "import json; d=json.load(open('data/upcoming.json')); assert isinstance(d, list)"

      - name: Fetch recent auction results
        run: |
          START=$(date -u -d '45 days ago' +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          curl -sSL --fail "https://www.treasurydirect.gov/TA_WS/securities/search?format=json&startdate=${START}&enddate=${END}" -o data/results.json
          python3 -c "import json; d=json.load(open('data/results.json')); assert isinstance(d, list)"

      # TreasuryDirect's /securities/search endpoint silently ignores the
      # startdate/enddate parameters above and returns its entire archive
      # back to 1979 — ~11,000 records at 120 fields each, about 37 MB. The
      # dashboard only ever renders the trailing window (and only the top 20
      # rows of it), but the browser was downloading all 37 MB on every page
      # load and again on every 5-minute auto-refresh. Trimming here is the
      # only reliable place to do it, since the API won't honour the filter.
      - name: Trim results to the trailing window
        run: |
          python3 - <<'PY'
          import json, datetime

          KEEP_DAYS = 60  # comfortably wider than the dashboard's 45-day view

          with open("data/results.json") as f:
              rows = json.load(f)

          cutoff = (datetime.date.today() - datetime.timedelta(days=KEEP_DAYS)).isoformat()

          def in_window(r):
              # Keep anything auctioned inside the window, plus announced-but-
              # not-yet-auctioned securities (auctionDate in the future).
              d = (r.get("auctionDate") or "")[:10]
              return bool(d) and d >= cutoff

          kept = [r for r in rows if in_window(r)]

          # Never write an empty file: if the shape or field name ever changes
          # upstream, keep the full payload rather than blanking the table.
          if not kept:
              raise SystemExit("Trim matched 0 records — leaving results.json untouched.")

          with open("data/results.json", "w") as f:
              json.dump(kept, f, separators=(",", ":"))

          print(f"Trimmed {len(rows)} -> {len(kept)} records (cutoff {cutoff}).")
          PY

      # /securities/announced returns every auction announced so far this
      # calendar year — 250 records at 120 fields, ~884 KB. loadUpcoming()
      # discards everything before today, so 245 of those 250 records were
      # downloaded on every page load purely to be thrown away. Keeping a
      # week of history as a safety margin against timezone edges.
      - name: Trim upcoming to announced-and-still-ahead
        run: |
          python3 - <<'PY'
          import json, datetime

          BACKSTOP_DAYS = 7

          with open("data/upcoming.json") as f:
              rows = json.load(f)

          cutoff = (datetime.date.today() - datetime.timedelta(days=BACKSTOP_DAYS)).isoformat()
          kept = [r for r in rows if ((r.get("auctionDate") or "")[:10]) >= cutoff]

          if not kept:
              raise SystemExit("Trim matched 0 records — leaving upcoming.json untouched.")

          with open("data/upcoming.json", "w") as f:
              json.dump(kept, f, separators=(",", ":"))

          print(f"Trimmed {len(rows)} -> {len(kept)} records (cutoff {cutoff}).")
          PY

      - name: Write fetch metadata
        run: |
          printf '{"fetchedAt":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/meta.json

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/upcoming.json data/results.json data/meta.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh Treasury auction data"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching latest and retrying..."
            git fetch origin main
            git reset --soft origin/main
            git add data/upcoming.json data/results.json data/meta.json
            if git diff --cached --quiet; then
              echo "Remote already has this data (another run pushed the same update). Nothing left to do."
              exit 0
            fi
            git commit -m "chore: refresh Treasury auction data"
            sleep $(( (RANDOM % 5) + 2 ))
          done

          echo "Failed to push after multiple attempts."
